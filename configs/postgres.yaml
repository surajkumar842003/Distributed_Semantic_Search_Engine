postgres:
  host: "localhost"
  port: 5432
  database: "wikirag"
  user: "postgres"
  password: "postgres_secure_password"
  pool_size_min: 10
  pool_size_max: 40
  
  tuning:
    shared_buffers: "64GB"
    effective_cache_size: "384GB"
    maintenance_work_mem: "32GB"
    work_mem: "64MB"
    max_parallel_maintenance_workers: 16
    max_parallel_workers_per_gather: 8
    max_worker_processes: 64
    checkpoint_completion_target: 0.9
    wal_buffers: "64MB"
    default_statistics_target: 100
    random_page_cost: 1.1

  bulk_load:
    batch_size: 50000
    drop_gin_before_load: true
    rebuild_gin_parallel: true

