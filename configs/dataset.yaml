dataset:
  source: "huggingface"
  dataset_id: "wikimedia/wikipedia"
  dataset_config: "20231101.en"
  split: "train"
  description: "Official Wikimedia Wikipedia snapshot in English, stored as Parquet on Hugging Face Hub."
  license: "CC BY-SA 3.0 / CC BY-SA 4.0"
  remote_url: "https://huggingface.co/datasets/wikimedia/wikipedia"
  
  # Pilot subset acquisition parameters
  pilot:
    target_rows: 50000            # Range: 50,000 to 100,000 articles
    batch_size: 2000              # PyArrow streaming batch size
    stream_download: true         # Stream from remote without full-corpus download
    preferred_shard: "train-00000-of-00041.parquet"  # HuggingFace Parquet shard
    shard_url: "https://huggingface.co/datasets/wikimedia/wikipedia/resolve/main/20231101.en/train-00000-of-00041.parquet"

  # Storage paths (strictly on /DATA/ to preserve root disk)
  storage:
    data_dir: "/DATA/suraj/m1/search_engine/data"
    raw_dir: "/DATA/suraj/m1/search_engine/data/raw"
    cache_dir: "/DATA/suraj/m1/search_engine/data/cache/huggingface"
    output_filename: "wikipedia_en_pilot_50k.parquet"
    metadata_filename: "dataset_metadata.json"
    checkpoint_filename: "download_checkpoint.json"
    inspection_report_filename: "dataset_inspection_report.json"

  # Network & Resumability
  network:
    timeout_seconds: 60
    max_retries: 5
    chunk_size_bytes: 10485760    # 10 MB chunks for HTTP Range resumption
    user_agent: "DistributedWikipediaRAG/0.1.0"

