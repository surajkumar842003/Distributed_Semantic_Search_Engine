# PostgreSQL Configuration - Tuned for 32 GB container / 16 CPU cores
# Target workload: High-throughput batch bulk COPY and fast parallel GIN inverted index queries

# Connectivity
listen_addresses = '*'
max_connections = 200

# Memory Architecture (32 GB RAM allocation)
shared_buffers = 8GB                  # 1/4 of container memory for shared page cache
effective_cache_size = 24GB           # Tell query planner how much OS page cache is available
maintenance_work_mem = 2GB            # Huge allocation for building GIN and B-Tree indexes fast
work_mem = 64MB                        # Per-query sort/hash memory
huge_pages = try

# Parallel Query & Maintenance Workers (16-core tuning)
max_worker_processes = 16
max_parallel_maintenance_workers = 4  # Parallel GIN index build across 4 cores
max_parallel_workers_per_gather = 4
max_parallel_workers = 12

# Storage & Disk I/O (NVMe / High-speed Array)
random_page_cost = 1.1                 # NVMe/Fast SSD random read penalty is minimal
effective_io_concurrency = 200
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 1GB

# Query Planner & Full Text Search
default_statistics_target = 100
gin_fuzzy_search_limit = 0
gin_pending_list_limit = 64MB          # Allow large pending list before inlining into posting trees

