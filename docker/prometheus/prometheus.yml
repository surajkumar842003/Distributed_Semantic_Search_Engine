global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "wikirag-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-service:8000"]
        labels:
          app: "wikipedia-rag"
          environment: "production"

  - job_name: "wikirag-embedding"
    metrics_path: "/health"
    static_configs:
      - targets: ["embedding-service:8001"]
        labels:
          app: "gpu-embedding-service"

